[project]
authors = ["Chuck Pepe-Ranney <chuck.peperanney@gmail.com>"]
channels = ["conda-forge", "chuckpr"]
description = "DATA 730 assignment environment"
name = "data730-assignment"
platforms = ["osx-64", "osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.9.*"
r-base = "*"
r-irkernel = "*"
r-tidymodels = "*"
r-tidyverse = "*"
r-vip = "*"
r-ranger = "*"
r-islr2 = "*"
r-moderndive = "*"
r-rpart = "*"
"r-rpart.plot" = "*"
r-palmerpenguins = "*"
scikit-learn = "*"
plotnine = "*"
statsmodels = "*"
altair = "*"
ipykernel = "*"

[pypi-dependencies]
palmerpenguins = "*"
drawdata = "*"

# JupyterLab frontend for running notebooks locally (e.g. on a laptop). This
# whole file is only for local use: the Codespaces devcontainer pulls the
# prebuilt ghcr.io/unc-data-730/env image, which already has everything
# installed, and never runs pixi. Locally, launch with:
#   pixi run -e lab jupyter lab
[feature.lab.dependencies]
jupyterlab = "*"

[environments]
lab = ["lab"]
